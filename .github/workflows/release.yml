name: Release packages and assets

# Called by release-lane.yml twice for the same commit: once as a rehearsal
# before the approval (publish: false) and once to publish after it
# (publish: true). Every step that touches the remote is publish-only, so the
# rehearsal proves the build without creating a tag or moving a release.
on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      release_id:
        required: true
        type: string
      release_body:
        required: true
        type: string
      notes_digest:
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

# The tag this run releases. Both calls read it, so the rehearsal and the
# publish measure the same version.
env:
  RELEASE_TAG: ${{ inputs.version != '' && inputs.version || inputs.tag }}
  LANE_TAG: ${{ inputs.tag }}
  LANE_REF: ${{ format('refs/tags/{0}', inputs.tag) }}
  LANE_REF_TYPE: tag
  LANE_PUBLISH: ${{ inputs.publish }}

# Every job below carries a timeout-minutes bound. Without one a job inherits
# GitHub's 360-minute default, and a stalled step can burn hours unnoticed.
#
# No job here declares `environment:`. The one approval lives on the lane's
# `approve` job, and a second environment would ask the maintainer twice for
# one decision.
jobs:
  release:
    name: Build and attach the plugin assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # uploads assets onto the release for this tag
      actions: read
    steps:
      # GATE: the notes are not the workflow's to write. A CHANGELOG entry is
      # deliberately one or two lines for a contributor, which makes poor
      # release notes for a reader deciding whether to upgrade. A human writes
      # the draft first and this refuses to publish without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $RELEASE_TAG. Write the notes first:" \
                 "gh release create $RELEASE_TAG --draft --notes-file NOTES.md"
            echo "::error::if a draft DOES exist, this job could not see it -" \
                 "check that the job still declares contents: write"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $RELEASE_TAG has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # GATE, publish only: the run really carries the approval, the tag really
      # exists at the checked commit, and the notes are still the ones that
      # were approved.
      - name: Verify approval and checked tag before publishing
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_NOTES_DIGEST: ${{ inputs.notes_digest }}
        run: python .github/scripts/release-lane.py permit

      # The rehearsal has no remote tag to check against, so it makes a local
      # one at the same commit. Nothing is pushed.
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ inputs.source_sha }}
        run: git tag "$CANDIDATE_TAG" "$CANDIDATE_SHA"

      # Cheapest check first: a mismatched tag is rejected before the install.
      - name: Verify the tag agrees with the manifest
        run: scripts/check-release-tag.sh "$RELEASE_TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile carries no git dependency any more: #37 moved the last
      # one, carve-grammars, onto a registry tarball. This stays as a net for
      # the next one, because a git+ssh entry installs on a runner only
      # through npm's own fallback to HTTPS, and a release must not rest on
      # that. Both lines write the SAME config key, so both need --add:
      # a plain set would replace the first rewrite with the second and leave
      # the ssh:// form uncovered.
      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global --add url."https://github.com/".insteadOf git@github.com:
          git config --global --get-all url."https://github.com/".insteadOf

      - run: npm ci

      # The same gate CI runs: tests, typecheck, and the production build that
      # writes main.js. A release is not the place to find out the bundle does
      # not compile.
      - run: npm run test:all

      # main.js is a build artifact and is not in the repo tree, so this is
      # what stands between a green workflow and a release carrying two of the
      # three files a user needs.
      - name: Verify the three release assets exist
        run: scripts/check-release-assets.sh

      # The release for this tag already exists as the draft holding the notes,
      # so `gh release create` would fail on it. Upload onto whatever is there
      # and create one only when there is nothing. This never flips a draft to
      # published; the lane's `finalize` does that, once the assets are verified.
      - name: Attach main.js, manifest.json, and styles.css
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading assets onto it."
          else
            echo "No release for $TAG yet; creating a draft to hold the assets."
            gh release create "$TAG" --draft --title "$TAG" --notes "Release $TAG"
          fi
          gh release upload "$TAG" main.js manifest.json styles.css --clobber

      # Ask GitHub what the release carries rather than trusting the upload's
      # exit code. A partial upload leaves a release that installs nothing.
      - name: The release actually carries all three assets
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort | tr '\n' ' ')"
          echo "Assets on $TAG: $names"
          missing=0
          for asset in main.js manifest.json styles.css; do
            case " $names " in
              *" $asset "*) ;;
              *) echo "::error::$asset is not attached to release $TAG."; missing=1 ;;
            esac
          done
          exit $missing
